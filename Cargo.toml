[workspace]
resolver = "3"
members = ["crates/qml_solid", "crates/qmltypes"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "MIT"

# One oxc for everything: the vendored parser (crates.io 0.144.0 plus the QML
# mode in `src/qml`) replaces the registry copy, so the QML front end and
# Solid's compiler share a lexer, an arena and AST types.
[patch.crates-io]
oxc_parser = { path = "vendor/oxc_parser" }

[profile.dev]
debug = "line-tables-only"
